name: Ingesta Valenbisi

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar el paquete
        run: pip install .

      - name: Ingestar snapshot
        run: python -m valenbisi.ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}